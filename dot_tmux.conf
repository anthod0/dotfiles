# ==================== Base ====================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g extended-keys on
set -ag terminal-features '*:extkeys'
set -g extended-keys-format csi-u
set -g allow-passthrough on

set -g set-clipboard on
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

set -g mouse on                    # 开启鼠标支持
set -g base-index 1                # 窗口从 1 开始编号
setw -g pane-base-index 1          # 面板从 1 开始编号
set -g renumber-windows off
setw -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "wl-copy"
set -g repeat-time 1200
set -g display-time 4000
set -g status-interval 5

# attach 时同步终端、SSH 和桌面相关环境变量
# Yazi relies on TERM/TERM_PROGRAM to select the image protocol after attach.
set -g update-environment 'TERM TERM_PROGRAM WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE'


# 前缀键改成 Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Move panes
bind -n M-H swap-pane -s '{left-of}'
bind -n M-J swap-pane -s '{down-of}'
bind -n M-K swap-pane -s '{up-of}'
bind -n M-L swap-pane -s '{right-of}'

bind -n M-o select-pane -t :.+1
bind -n M-Q kill-pane
bind -n M-z resize-pane -Z

# Switch workspace; create it if absent, or return to the previous one if active
bind -n M-1 if-shell '[ "$(tmux display -p "#I")" != "1" ]' "if-shell 'tmux select-window -t :1' '' 'new-window -t :1'" last-window
bind -n M-2 if-shell '[ "$(tmux display -p "#I")" != "2" ]' "if-shell 'tmux select-window -t :2' '' 'new-window -t :2'" last-window
bind -n M-3 if-shell '[ "$(tmux display -p "#I")" != "3" ]' "if-shell 'tmux select-window -t :3' '' 'new-window -t :3'" last-window
bind -n M-4 if-shell '[ "$(tmux display -p "#I")" != "4" ]' "if-shell 'tmux select-window -t :4' '' 'new-window -t :4'" last-window
bind -n M-5 if-shell '[ "$(tmux display -p "#I")" != "5" ]' "if-shell 'tmux select-window -t :5' '' 'new-window -t :5'" last-window
bind -n M-6 if-shell '[ "$(tmux display -p "#I")" != "6" ]' "if-shell 'tmux select-window -t :6' '' 'new-window -t :6'" last-window
bind -n M-7 if-shell '[ "$(tmux display -p "#I")" != "7" ]' "if-shell 'tmux select-window -t :7' '' 'new-window -t :7'" last-window
bind -n M-8 if-shell '[ "$(tmux display -p "#I")" != "8" ]' "if-shell 'tmux select-window -t :8' '' 'new-window -t :8'" last-window
bind -n M-9 if-shell '[ "$(tmux display -p "#I")" != "9" ]' "if-shell 'tmux select-window -t :9' '' 'new-window -t :9'" last-window
bind -n M-0 if-shell '[ "$(tmux display -p "#I")" != "10" ]' "if-shell 'tmux select-window -t :10' '' 'new-window -t :10'" last-window

# popup
bind -n M-g display-popup -E -w 80% -h 80% -d "#{session_path}" "sh -lc 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 || exit 0; exec lazygit'"
bind -n M-p display-popup -E -w 80% -h 80% -d "#{session_path}"

# tmux session tree
bind -n M-w choose-tree -Zs

# ==================== Plugins ====================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# tmux-yank
set -g @copy_mode_yank 'wl-copy'
set -g @yank_action 'copy-pipe-and-cancel "wl-copy"'
set -g @yank_with_mouse 'wl-copy'

# tmux-battery
set -g @batt_icon_charge_tier8 '󰂁'
set -g @batt_icon_charge_tier7 '󰂀'
set -g @batt_icon_charge_tier6 '󰁿'
set -g @batt_icon_charge_tier5 '󰁾'
set -g @batt_icon_charge_tier4 '󰁽'
set -g @batt_icon_charge_tier3 '󰁼'
set -g @batt_icon_charge_tier2 '󰁻'
set -g @batt_icon_charge_tier1 '󰁺'
set -g @batt_icon_status_charged '󰂅'
set -g @batt_icon_status_charging '󰢝'
set -g @batt_icon_status_discharging '󱉞'

# ==================== Theme ====================
# dark palette
# set -g @fg0    '#fbf1c7'
# set -g @bg0    '#282828'
# set -g @bg1    '#3c3836'
# set -g @bg3    '#665c54'
