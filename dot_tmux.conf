# set -g @lblue  '#83a598'

# light palette
set -g @fg0    '#fbf1c7'
set -g @bg0    'default'
set -g @bg1    '#928374'
set -g @bg3    '#7c6f64'
set -g @bg4    '#665c54'
set -g @blue   '#458588'
set -g @aqua   '#689d6a'
set -g @green  '#98971a'
set -g @orange '#d65d0e'
set -g @purple '#b16286'
set -g @red    '#cc241d'
set -g @yellow '#d79921'
set -g @lblue  '#83a598'

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-style        'fg=#{@bg3}'
set -g pane-active-border-style 'fg=#{@orange}'
set -g pane-border-format       ' #{pane_index} #{pane_current_command} '

# Status bar
set -g status-style  'bg=#{@bg0},fg=#{@fg0}'
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 80

# tmux-cpu format
set -g @cpu_percentage_format "%2.0f%%"
set -g @ram_percentage_format "%2.0f%%"

# Hide the battery segment when no battery is available
run-shell '~/.tmux/plugins/tmux-battery/battery_enabled.tmux'

set -g  status-left '#{?client_prefix,#[fg=#{@yellow}],#[fg=#{@orange}]}▒▓'
set -ag status-left '#[fg=#{@fg0},bold]#{?client_prefix,#[bg=#{@yellow}],#[bg=#{@orange}]}#{session_icon} #S '

set -g  status-right '#[fg=#{@green},bg=#{@bg0}]'
set -ag status-right '#[fg=#{@fg0},bg=#{@green}] #{cpu_percentage} │ #{ram_percentage} '
set -ag status-right '#[fg=#{@fg0},bg=#{@yellow}]  %H:%M '
set -ag status-right '#{?#{==:#{E:@battery_exists},true},#[fg=#{@fg0}]#[bg=#{@blue}] #{battery_icon} #{battery_percentage} ,}'
set -ag status-right '#[fg=#{@fg0},bg=#{@orange}]  #(tmux list-sessions | wc -l) '
set -ag status-right '#[fg=#{@orange},bg=#{@bg0}]▓▒'

# Window list
set -g window-status-format '#[fg=#{@fg0},bg=#{@bg3}] #I #W#{cc-state} #{?window_end_flag,#[fg=#{@bg3}#,bg=#{@bg0}],}'
set -g window-status-current-format '#[fg=#{@fg0},bg=#{@blue},bold] #I #W#{cc-state} #{?window_end_flag,#[fg=#{@blue}#,bg=#{@bg0}],}'
set -g window-status-separator ''

# Message & mode
set -g message-style         'bg=#{@orange},fg=#{@fg0}'
set -g message-command-style 'bg=#{@bg3},fg=#{@fg0}'
set -g mode-style            'bg=#{@lblue},fg=#{@bg0}'
set -g clock-mode-colour     '#d65d0e'

# ==================== Local ====================
run-shell '~/.tmux/local/session-icon/session-icon.tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
