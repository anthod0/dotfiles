"$schema" = 'https://starship.rs/config-schema.json'

format = """
[▒▓](fg:color_orange)\
${custom.hostname_icon}\
$username\
$hostname\
[ ](bg:color_orange)\
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$time\
[ ](fg:color_green)\
$line_break$character
"""

palette = 'gruvbox'

[palettes.gruvbox]
color_fg0 = '#fbf1c7'
color_bg1 = '#83a598'
color_bg3 = '#928374'
color_red = '#cc241d'
color_orange = '#d65d0e'
color_yellow = '#d79921'
color_green = '#98971a'
color_aqua = '#689d6a'
color_blue = '#458588'
color_purple = '#b16286'

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[$user]($style)'

[hostname]
style = "bg:color_orange fg:color_fg0"
format = '[@$hostname]($style)'

[custom.hostname_icon]
command = '$HOME/.local/bin/hostname-icon'
when = true
style = "bg:color_orange fg:color_fg0"
format = '[$output ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[cpp]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_green"
format = '[[  $time ](fg:color_fg0 bg:color_green)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[❯](color_orange)[❯](color_aqua)[❯](color_blue)"
error_symbol = "[❯](color_red)[❯](color_orange)[❯](color_yellow)"
vimcmd_symbol = "[•](color_blue)[•](color_aqua)[•](color_orange)"
vimcmd_replace_one_symbol = "[•](color_purple)[•](color_aqua)[•](color_orange)"
vimcmd_replace_symbol = "[•](color_purple)[•](color_aqua)[•](color_orange)"
vimcmd_visual_symbol = "[•](color_yellow)[•](color_aqua)[•](color_orange)"
